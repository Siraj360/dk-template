name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular app
        id: build
        run: |
          npx ng build --base-href "/dk-template/"
          if [ -d "dist/dk-template/browser" ]; then
            cp dist/dk-template/browser/index.html dist/dk-template/browser/404.html
            echo "artifact_path=dist/dk-template/browser" >> $GITHUB_OUTPUT
          else
            cp dist/dk-template/index.html dist/dk-template/404.html
            echo "artifact_path=dist/dk-template" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.artifact_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
